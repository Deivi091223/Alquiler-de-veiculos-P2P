<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Conductor - Alquiler de Vehículos P2P</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-pagina="conductor">

    <header class="navbar-header">
        <div class="nav-container">
            <div class="logo-area">
                <span class="badge-p2p">P2P</span>
                <div class="logo-text">
                    <h1>Alquiler de Vehículos P2P</h1>
                    <small>PLATAFORMA DE VEHÍCULOS · V1.0</small>
                </div>
            </div>
            <nav class="nav-links">
                <a href="index.html#inicio">Inicio</a>
                <a href="index.html#catalogo">Catálogo</a>
                <a href="index.html#beneficios">Beneficios</a>
            </nav>
            <div class="nav-actions">
                <span class="sesion-activa" id="nombreSesion"></span>
                <button class="btn-demo" id="btnCerrarSesion" onclick="cerrarSesion()" hidden>Cerrar sesión</button>
                <div class="dropdown">
                    <button class="btn-dropdown">Acceso Perfiles <i class="fa-solid fa-chevron-down"></i></button>
                    <div class="dropdown-content">
                        <a href="#" onclick="abrirPerfil('CLIENTE'); return false;"><i class="fa-solid fa-user"></i> Perfil Conductor</a>
                        <a href="#" onclick="abrirPerfil('PROPIETARIO'); return false;"><i class="fa-solid fa-car"></i> Perfil Propietario</a>
                        <a href="#" onclick="abrirPerfil('ADMIN'); return false;"><i class="fa-solid fa-shield-halved"></i> Operaciones y Soporte</a>
                    </div>
                </div>
                <div class="dropdown">
                    <button class="btn-register">Crear Cuenta <i class="fa-solid fa-chevron-down"></i></button>
                    <div class="dropdown-content">
                        <a href="#" onclick="abrirRegistro('CLIENTE'); return false;">Como Conductor</a>
                        <a href="#" onclick="abrirRegistro('PROPIETARIO'); return false;">Como Propietario</a>
                    </div>
                </div>
            </div>
        </div>
    </header>
